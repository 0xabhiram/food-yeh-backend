version: '3.8'

services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./foodyeh.db
      - JWT_SECRET=dev-secret-key-change-in-production
      - REDIS_URL=redis://redis:6379
      - MQTT_BROKER_URL=host.docker.internal
      - MQTT_BROKER_PORT=1883
      - MQTT_USERNAME=admin
      - MQTT_PASSWORD=admin123
      - CORS_ORIGINS=["http://localhost:3000", "http://localhost:8080"]
    volumes:
      - ./backend:/app
      - foodyeh_uploads:/app/uploads
      - foodyeh_logs:/app/logs
    depends_on:
      - redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - foodyeh_redis_data:/data
    command: redis-server --appendonly yes

  mosquitto:
    image: eclipse-mosquitto:2.0
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
      - foodyeh_mosquitto_data:/mosquitto/data
      - foodyeh_mosquitto_logs:/mosquitto/log
    command: mosquitto -c /mosquitto/config/mosquitto.conf

volumes:
  foodyeh_uploads:
  foodyeh_logs:
  foodyeh_redis_data:
  foodyeh_mosquitto_data:
  foodyeh_mosquitto_logs:
