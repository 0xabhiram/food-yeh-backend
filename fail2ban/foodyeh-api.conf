[Definition]
# Foodyeh API Fail2ban Jail Configuration
# Protects against brute force attacks on auth endpoints

# Jail for Nginx rate limiting violations
[nginx-limit-req]
enabled = true
port = http,https
filter = nginx-limit-req
logpath = /var/log/nginx/error.log
maxretry = 10
bantime = 3600
findtime = 600

# Jail for failed HTTP authentication
[nginx-http-auth]
enabled = true
port = http,https
filter = nginx-http-auth
logpath = /var/log/nginx/error.log
maxretry = 5
bantime = 1800
findtime = 300

# Jail for application-level auth failures
[foodyeh-auth]
enabled = true
port = http,https
filter = foodyeh-auth
logpath = /var/log/foodyeh/api.log
maxretry = 10
bantime = 7200
findtime = 600

# Jail for MQTT authentication failures
[mqtt-auth]
enabled = true
port = mqtt,mqtt-ws
filter = mqtt-auth
logpath = /var/log/mosquitto/mosquitto.log
maxretry = 5
bantime = 3600
findtime = 300
