# Mosquitto Configuration for Foodyeh POC

# Basic configuration
port 1883
protocol mqtt

# WebSocket support
listener 9001
protocol websockets

# Authentication
allow_anonymous false
password_file /mosquitto/config/passwd

# Logging
log_type all
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout

# Security
max_queued_messages 200
max_inflight_messages 20

# Persistence
persistence true
persistence_location /mosquitto/data/

# Connection settings
max_connections 100
connection_messages true
log_timestamp true
